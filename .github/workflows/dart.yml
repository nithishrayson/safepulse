name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'  # Replace with your desired Flutter version if needed

      # Step 3: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Analyze the project and skip errors
      - name: Analyze project
        run: flutter analyze || true

      # Step 5: Run unit tests and skip errors
      - name: Run tests
        run: flutter test || true

      # Step 6: Optionally build the APK for deployment
      - name: Build APK
        run: flutter build apk --release  # Use --release for production-ready APK

      # Optional: Upload the APK as an artifact (for testing or distribution)
      # - name: Upload APK
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: app-release
      #     path: build/app/outputs/flutter-apk/app-release.apk
